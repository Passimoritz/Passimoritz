<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="Numbers"><style>
:root{--line:#30363d;--fg:#f0f6fc;--muted:#9198a1}
@media (prefers-color-scheme:light){:root{--line:#d1d9e0;--fg:#1f2328;--muted:#59636e}}
.t{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace}
.f{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.ln{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
<linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<g class="t">
<rect x="2" y="18" width="56" height="48" rx="14" fill="url(#n)" fill-opacity=".14" style="stroke:var(--line)" class="f"/>
<text x="30" y="49" text-anchor="middle" class="m f" font-size="17" font-weight="700" fill="url(#n)">02</text>
<text x="76" y="44" class="m f" font-size="11" letter-spacing="2.6" style="fill:var(--muted);animation-delay:.08s">LIVE FROM THE GITHUB API</text>
<text x="74" y="72" font-size="30" font-weight="800" letter-spacing="-.6" class="f" style="fill:var(--fg);animation-delay:.14s">Numbers</text>
<rect x="256" y="61" width="940" height="2" rx="1" fill="url(#g)" class="ln"/>
<circle cy="62" r="3" fill="#a78bfa"><animate attributeName="cx" values="256;1160" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="4.5s" repeatCount="indefinite"/></circle>
</g></svg>
