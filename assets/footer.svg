<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Thanks for stopping by">
  <style>
    :root { --fg:#f0f6fc; --muted:#9198a1; --wave:.5; }
    @media (prefers-color-scheme: light) { :root { --fg:#1f2328; --muted:#59636e; --wave:.35; } }
    .t { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; }
    .w { opacity: var(--wave); }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <g class="w" fill="none" stroke="url(#g)" stroke-width="2">
    <path d="M0 96 Q150 66 300 96 T600 96 T900 96 T1200 96 T1500 96">
      <animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 108 Q150 128 300 108 T600 108 T900 108 T1200 108 T1500 108" stroke-opacity=".6">
      <animateTransform attributeName="transform" type="translate" values="-300 0;0 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0 102 Q100 86 200 102 T400 102 T600 102 T800 102 T1000 102 T1200 102 T1400 102" stroke-opacity=".35">
      <animateTransform attributeName="transform" type="translate" values="0 0;-200 0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="600" y="44" text-anchor="middle" class="t" font-size="22" font-weight="700" fill="url(#g)">Thanks for stopping by</text>
  <text x="600" y="68" text-anchor="middle" class="m" font-size="11" letter-spacing="3" style="fill:var(--muted)">BUILT WITH SVG · REFRESHED EVERY 6 HOURS</text>
</svg>
