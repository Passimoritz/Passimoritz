<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Pascal Moritz – IT and Project Manager, Sales Manager, Software Enthusiast">
  <style>
    :root { --bg:#0d1117; --line:#30363d; --fg:#f0f6fc; --muted:#9198a1; --accent:#38bdf8; --node:#161b22; --grid:#ffffff; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#ffffff; --line:#d1d9e0; --fg:#1f2328; --muted:#59636e; --accent:#0969da; --node:#f6f8fa; --grid:#000000; }
    }
    .t { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .f { animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
    .bar { transform-box: fill-box; transform-origin: center top; animation: drop 1s cubic-bezier(.2,.7,.2,1) both; }
    .role { opacity: 0; animation: role 9s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .edge { stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 6; animation: flow 3s linear infinite; }
    .node { fill: var(--node); stroke: var(--accent); stroke-width: 1.6; }
    .halo { fill: var(--accent); opacity: .18; transform-box: fill-box; transform-origin: center; animation: halo 3s ease-out infinite; }
    .lbl { font-size: 12px; fill: var(--muted); letter-spacing: .6px; }
    .grid { stroke: var(--grid); stroke-opacity: .04; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes drop { from { transform: scaleY(0); } }
    @keyframes role { 0% { opacity: 0; transform: translateY(8px); } 4%, 29% { opacity: 1; transform: none; } 33%, 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes halo { 0% { transform: scale(.6); opacity: .35; } 100% { transform: scale(2.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .role { opacity: 0; } .r1 { opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="clip"><rect width="1200" height="240" rx="12"/></clipPath>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#0ea5e9"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" class="grid"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#38bdf8" stop-opacity=".16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="240" fill="var(--bg)"/>
    <rect width="1200" height="240" fill="url(#grid)"/>
    <circle cx="980" cy="120" r="260" fill="url(#glow)">
      <animate attributeName="r" values="240;280;240" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- left: identity -->
    <rect x="48" y="56" width="4" height="128" rx="2" fill="var(--accent)" class="bar"/>
    <text x="76" y="104" class="t f" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#name)" style="animation-delay:.15s">Pascal Moritz</text>

    <g class="t" font-size="24" font-weight="600" fill="var(--fg)">
      <text x="76" y="146" class="role r1">IT &amp; Project Manager<tspan class="cursor" fill="var(--accent)"> ▍</tspan></text>
      <text x="76" y="146" class="role r2" style="animation-delay:3s">Sales Manager<tspan class="cursor" fill="var(--accent)"> ▍</tspan></text>
      <text x="76" y="146" class="role r3" style="animation-delay:6s">Software Enthusiast<tspan class="cursor" fill="var(--accent)"> ▍</tspan></text>
    </g>
    <text x="76" y="182" class="t f" font-size="16" fill="var(--muted)" style="animation-delay:.5s">Digital projects · IT security · AI-assisted building · Self-hosting</text>

    <!-- right: what connects -->
    <g>
      <path id="e1" d="M820 70 L960 120" class="edge"/>
      <path id="e2" d="M960 120 L1110 70" class="edge"/>
      <path id="e3" d="M960 120 L860 190" class="edge"/>
      <path id="e4" d="M960 120 L1080 190" class="edge"/>
      <path d="M820 70 L860 190" class="edge"/>
      <path d="M1110 70 L1080 190" class="edge"/>

      <circle r="3.5" fill="var(--accent)"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="3.5" fill="#a78bfa"><animateMotion dur="3.1s" begin=".7s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
      <circle r="3.5" fill="var(--accent)"><animateMotion dur="2.9s" begin="1.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e3"/></animateMotion></circle>
      <circle r="3.5" fill="#a78bfa"><animateMotion dur="3.4s" begin=".4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e4"/></animateMotion></circle>

      <g class="t">
        <circle cx="960" cy="120" r="14" class="halo"/>
        <circle cx="960" cy="120" r="9" class="node"/>
        <text x="960" y="152" text-anchor="middle" class="lbl">PROJECTS</text>

        <circle cx="820" cy="70" r="12" class="halo" style="animation-delay:.6s"/>
        <circle cx="820" cy="70" r="7" class="node"/>
        <text x="820" y="48" text-anchor="middle" class="lbl">IT</text>

        <circle cx="1110" cy="70" r="12" class="halo" style="animation-delay:1.2s"/>
        <circle cx="1110" cy="70" r="7" class="node"/>
        <text x="1110" y="48" text-anchor="middle" class="lbl">SALES</text>

        <circle cx="860" cy="190" r="12" class="halo" style="animation-delay:1.8s"/>
        <circle cx="860" cy="190" r="7" class="node"/>
        <text x="860" y="220" text-anchor="middle" class="lbl">AI</text>

        <circle cx="1080" cy="190" r="12" class="halo" style="animation-delay:2.4s"/>
        <circle cx="1080" cy="190" r="7" class="node"/>
        <text x="1080" y="220" text-anchor="middle" class="lbl">SELF-HOSTING</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="12" fill="none" stroke="var(--line)"/>
</svg>
