<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img" aria-label="hostwerk-ext-webhook-inbox">
<defs><clipPath id="k"><rect width="600" height="150" rx="12"/></clipPath><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>
:root{--bg:#0d1117;--line:#30363d;--fg:#f0f6fc;--muted:#9198a1;--accent:#38bdf8}
@media (prefers-color-scheme:light){:root{--bg:#ffffff;--line:#d1d9e0;--fg:#1f2328;--muted:#59636e;--accent:#0969da}}
.t{font-family:-apple-system,'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif}
.n{font-size:19px;font-weight:700;fill:var(--accent)}
.d{font-size:14px;fill:var(--fg);opacity:.85}
.m{font-size:13px;fill:var(--muted)}
.f{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes sheen{0%{transform:translateX(-300px)}55%,100%{transform:translateX(900px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#k)"><rect width="600" height="150" style="fill:var(--bg)"/>
<rect width="600" height="3" fill="url(#a)" class="bar" style="animation-delay:0.00s"/>
<g class="t f" style="animation-delay:0.10s">
<path d="M26 30h14a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H26zm0 0v24" fill="none" stroke-width="1.6" style="stroke:var(--muted)"/>
<text x="54" y="48" class="n">hostwerk-ext-webhook-inbox</text>
<text x="26" y="80" class="d">An address for the webhooks of Stripe, GitHub, PayPal &amp; co. –</text>
<text x="26" y="100" class="d">public through Hostwerk&#x27;s tunnel if you like. Every call with…</text>
</g>
<g class="t f m" style="animation-delay:0.25s">
<circle cx="32" cy="128" r="6" fill="#f1e05a" class="dot"/>
<text x="44" y="133" class="m">JavaScript</text>
<text x="136" y="133" class="m">★ 0</text>
<text x="186" y="133" class="m">⑂ 0</text>
<text x="574" y="133" text-anchor="end" class="m">updated just now</text>
</g>
<rect width="300" height="150" fill="url(#s)" class="sheen"/></g>
<rect x=".5" y=".5" width="599" height="149" rx="12" fill="none" style="stroke:var(--line)"/></svg>