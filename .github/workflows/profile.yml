name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/profile.yml]

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        env:
          # Optional: classic PAT in METRICS_TOKEN also counts private contributions.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py "${{ github.repository_owner }}" assets/stats.svg

      - name: Update README blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py "${{ github.repository_owner }}" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile data"
          git pull --rebase
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      # Full action (not svg-only): reads the calendar through the API with the same token as the
      # stats card, so the snake eats the same contributions the profile shows. svg-only scrapes
      # the public page without a token and only saw a handful of days.
      - uses: Platane/snk@v3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0969da&color_dots=#ebeef2,#bae6fd,#7dd3fc,#0ea5e9,#0369a1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#1b2230,#0c4a6e,#0369a1,#0ea5e9,#7dd3fc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
