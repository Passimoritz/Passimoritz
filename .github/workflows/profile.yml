name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  # Optional: the Mirage repo can trigger an instant refresh of the reel with
  # `gh api repos/Passimoritz/Passimoritz/dispatches -f event_type=mirage-updated`
  repository_dispatch:
    types: [mirage-updated]
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/profile.yml]

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pillow draws the Mirage reel; fontTools + brotli embed font subsets in the SVGs
      - name: Install Pillow and fontTools
        run: python3 -m pip install --quiet pillow fonttools brotli

      - name: Build comic pages
        run: python3 scripts/comic.py

      - name: Rebuild Mirage reel when its screenshots changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/mirage_reel.py

      - name: Generate stats card
        env:
          # Optional: classic PAT in METRICS_TOKEN also counts private contributions.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py "${{ github.repository_owner }}" assets/stats.svg

      - name: Update README blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py "${{ github.repository_owner }}" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile data"
          git pull --rebase
          git push
